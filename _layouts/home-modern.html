<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: 'Yue Zhuo' }} · Cornell University</title>
  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
  <meta name="theme-color" content="#f8f8f5">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Yue Zhuo · Trustworthy & Explainable AI">
  <meta property="og:description" content="{{ page.excerpt | strip_html | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/profile.jpg">
  <link rel="icon" type="image/png" href="{{ '/images/site-logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/home-modern.css' | relative_url }}">
</head>
<body class="yz-home">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" id="top">
    <div class="site-container header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Yue Zhuo homepage">
        <span class="brand-monogram">YZ<span class="brand-dot">.</span></span>
        <span class="brand-name">Yue Zhuo</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#publications">Publications</a>
        <a href="#writing">Writing</a>
        <a href="#experience">Experience</a>
      </nav>
      <a class="nav-cv" href="{{ '/assets/Curriculum_Vitae.pdf' | relative_url }}" target="_blank" rel="noopener">CV <span aria-hidden="true">↗</span></a>
    </div>
  </header>
  <main id="main-content">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-container footer-inner">
      <span>© {{ 'now' | date: '%Y' }} Yue Zhuo</span>
      <span>Built with Jekyll · Hosted on GitHub Pages</span>
      <a href="#top" aria-label="Back to top">Back to top ↑</a>
    </div>
  </footer>
</body>
</html>
