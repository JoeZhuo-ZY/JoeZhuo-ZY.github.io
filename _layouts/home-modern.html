<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: 'Yue Zhuo' }} · Cornell University</title>
  <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Yue Zhuo · Trustworthy & Explainable AI">
  <meta property="og:description" content="{{ page.excerpt | strip_html | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/assets/profile.jpg">
  <link rel="icon" type="image/png" href="{{ '/images/site-logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/home-modern.css' | relative_url }}">
</head>
<body class="yz-home">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="site-container header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">Yue Zhuo</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#research">Research</a>
        <a href="#highlights">Highlights</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/year-archive/' | relative_url }}">Posts</a>
        <a href="{{ '/assets/Curriculum_Vitae.pdf' | relative_url }}" target="_blank" rel="noopener noreferrer">CV ↗</a>
      </nav>
    </div>
  </header>
  <main id="main-content" class="main-content site-container">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-container footer-inner">
      <span>© {{ 'now' | date: '%Y' }} Yue Zhuo</span>
      <span><a href="mailto:yz3422@cornell.edu">Email</a> · <a href="https://scholar.google.com/citations?user=Zzau7DwAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Google Scholar</a> · <a href="https://github.com/JoeZhuo-ZY" target="_blank" rel="noopener noreferrer">GitHub</a></span>
    </div>
  </footer>
</body>
</html>
